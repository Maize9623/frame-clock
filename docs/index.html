fff1a}}.range-row{align-items:center;gap:12px;display:flex}.range{accent-color:var(--accent);flex:1}.range-row output{text-align:right;min-width:4.2em;color:var(--ink-2);font-size:13px}.chips{flex-wrap:wrap;gap:8px;display:flex}.chip{border:1px solid var(--line);color:var(--ink-2);cursor:pointer;background:#7f89a01a;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:550;transition:background-color .16s,color .16s,border-color .16s}.chip.is-on{background:var(--accent);color:var(--accent-ink);border-color:#0000}.custom-list{gap:8px;margin:0;padding:0;list-style:none;display:grid}.custom-item{background:#7f89a01a;border-radius:12px;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 12px;display:grid}.custom-item .title{white-space:nowrap;text-overflow:ellipsis;font-size:14px;font-weight:550;overflow:hidden}.custom-item .sub{color:var(--ink-3);margin-top:2px;font-size:12px}.custom-item .del{color:var(--holiday-ink);cursor:pointer;background:#d6303124;border:0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600}.custom-form{grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:8px;display:grid}.custom-form .check{color:var(--ink-2);grid-column:1/-1;align-items:center;gap:7px;font-size:13px;display:flex}.custom-form .primary-btn{grid-area:3/2}.primary-btn{background:var(--accent);color:var(--accent-ink);cursor:pointer;border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}.primary-btn:active{transform:scale(.98)}.form-hint{min-height:1.2em;color:var(--holiday-ink);margin:0;font-size:12px}.settings-foot{color:var(--ink-3);margin:14px 0 0;font-size:12px;line-height:1.65}.settings-foot code{background:#7f89a02e;border-radius:5px;padding:1px 5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.94em}.frame-mode .settings-scrim,.frame-mode .settings,.frame-mode .gear,.frame-mode .icon-btn,.frame-mode .ghost-btn{display:none!important}.frame-mode .cell,.frame-mode .month-title{cursor:none}@media (hover:none){.icon-btn:hover,.ghost-btn:hover,.chip:hover{background:#7f89a024}}@media (prefers-reduced-motion:reduce){.blob,.sheen{animation:none!important}.settings,.settings-scrim,.icon-btn,.ghost-btn,.cell,.segmented button,.chip{transition:none!important}}@media (max-aspect-ratio:1){.topbar{grid-template-columns:minmax(0,1fr)}.clock-time{font-size:clamp(34px,9vmin,84px)}.calendar{grid-template-rows:auto auto minmax(0,auto) auto}.grid{grid-auto-rows:minmax(46px,auto)}.countdown{grid-template-rows:auto auto;height:auto;min-height:auto}.cd-list{min-height:min-content;overflow:visible}.clock,.weather,.calendar,.today,.countdown{border-radius:22px}}@media (max-width:520px){.stage{gap:10px;padding:10px}.today{grid-template-columns:minmax(0,1fr)}.today-day{justify-items:start;font-size:44px}.custom-form{grid-template-columns:minmax(0,1fr)}.custom-form .primary-btn{grid-area:auto/1}}

</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
    <span class="sheen"></span>
    <span class="grain"></span>
  </div>

  <main class="stage" id="stage">
    <header class="topbar">
      <section class="clock glass" aria-label="时钟">
        <div class="clock-time" id="clockTime">--:--</div>
        <div class="clock-meta">
          <span id="clockSeconds">:--</span>
          <span class="dot" aria-hidden="true">·</span>
          <span id="clockWeekday">—</span>
        </div>
      </section>

      <section class="weather glass" id="weather" aria-live="polite" aria-label="天气">
        <div class="weather-loading" id="weatherLoading">正在获取天气…</div>
      </section>
    </header>

    <section class="calendar glass" aria-label="月历">
      <div class="calendar-head">
        <div class="month-block">
          <h1 class="month-title" id="monthTitle">—</h1>
          <p class="month-sub" id="monthSub"></p>
        </div>
        <div class="month-actions">
          <button type="button" class="ghost-btn" id="btnToday" aria-label="回到今天">今天</button>
          <button type="button" class="icon-btn" id="btnPrev" aria-label="上个月">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5 9 12l5.5 5.5" /></svg>
          </button>
          <button type="button" class="icon-btn" id="btnNext" aria-label="下个月">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5 15 12l-5.5 5.5" /></svg>
          </button>
        </div>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="grid" id="grid" role="grid" aria-label="日期网格"></div>
      <p class="calendar-foot" id="calendarFoot"></p>
    </section>

    <section class="side">
      <section class="today glass" id="todayCard" aria-label="今日详情">
        <div class="today-day" id="todayDay">—</div>
        <div class="today-lines" id="todayLines"></div>
      </section>

      <section class="countdown glass" aria-label="重要日子倒计时">
        <div class="section-head">
          <h2>重要日子</h2>
          <button type="button" class="icon-btn gear" id="btnSettings" aria-label="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2" />
              <path d="M12 3.2v2.4M12 18.4v2.4M4.8 12H2.4M21.6 12h-2.4M6.9 6.9 5.2 5.2M18.8 18.8l-1.7-1.7M17.1 6.9l1.7-1.7M5.2 18.8l1.7-1.7" />
            </svg>
          </button>
        </div>
        <ul class="cd-list" id="cdList"></ul>
      </section>
    </section>
  </main>

  <div class="settings-scrim" id="scrim" hidden></div>
  <aside class="settings glass" id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <header class="settings-head">
      <h2 id="settingsTitle">设置</h2>
      <button type="button" class="icon-btn" id="btnCloseSettings" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </header>

    <div class="settings-body">
      <div class="field">
        <span class="field-label">外观</span>
        <div class="segmented" id="segTheme" role="radiogroup" aria-label="外观">
          <button type="button" data-value="auto">自动</button>
          <button type="button" data-value="light">白天</button>
          <button type="button" data-value="dark">黑夜</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">天气位置</span>
        <div class="segmented" id="segLocation" role="radiogroup" aria-label="天气位置">
          <button type="button" data-value="auto">自动定位</button>
          <button type="button" data-value="city">指定城市</button>
        </div>
        <input class="text-input" id="cityInput" type="text" autocomplete="off" placeholder="城市名，例如 杭州、Beijing" />
      </div>

      <div class="field">
        <span class="field-label">整体缩放</span>
        <div class="range-row">
          <input class="range" id="scaleInput" type="range" min="0.7" max="1.6" step="0.05" />
          <output id="scaleOutput">1.00×</output>
        </div>
      </div>

      <div class="field">
        <span class="field-label">内置节日</span>
        <div class="chips" id="builtinChips"></div>
      </div>

      <div class="field">
        <span class="field-label">自定义倒计时</span>
        <ul class="custom-list" id="customList"></ul>
        <div class="custom-form">
          <input class="text-input" id="customLabel" type="text" maxlength="12" autocomplete="off" placeholder="名称，如 结婚纪念日" />
          <input class="text-input" id="customDate" type="date" />
          <label class="check"><input type="checkbox" id="customYearly" checked /> <span>每年重复</span></label>
          <button type="button" class="primary-btn" id="customAdd">添加</button>
        </div>
        <p class="form-hint" id="customHint"></p>
      </div>

      <p class="settings-foot">
        相框模式请在地址后加 <code>?mode=frame</code>，可用 <code>?city=</code> 固定城市、<code>?scale=</code> 调缩放。
        节假日数据来自国务院办公厅通知，未录入的年份会标注“待更新”。
      </p>
    </div>
  </aside>

  <script>
    // 截图与自动化验收用：?open=settings 打开时直接展开设置面板
    if (new URLSearchParams(location.search).get('open') === 'settings') {
      setTimeout(function () {
        var gear = document.getElementById('btnSettings');
        if (gear) gear.click();
      }, 600);
    }
  </script>
</body>
</html>
